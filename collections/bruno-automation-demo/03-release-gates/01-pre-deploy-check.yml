info:
  name: Pre-Deploy Check
  type: http
  seq: 1
  tags:
    - release-gate
    - ci
    - staging

http:
  method: POST
  url: "{{bruno_echo_url}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: X-Bruno-Gate
      value: pre-deploy
  body:
    type: json
    data: |-
      {
        "check": "pre-deploy",
        "environment": "{{target_environment}}",
        "buildId": "{{build_id}}",
        "ready": true
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status should be 200", function () {
          expect(res.status).to.equal(200);
        });

        test("gate should target the active environment", function () {
          expect(res.body.environment).to.equal(bru.getGlobalEnvVar("target_environment"));
        });

        test("gate header should be returned by the echo server", function () {
          expect(res.headers["x-bruno-gate"]).to.equal("pre-deploy");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Represents a pre-deploy validation gate in a pipeline.
