info:
  name: Platform Ping
  type: http
  seq: 1
  tags:
    - smoke
    - ci
    - github-actions
    - jenkins
    - azure

http:
  method: POST
  url: "{{bruno_echo_url}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "check": "platform-ping",
        "platform": "{{platform_name}}",
        "environment": "{{target_environment}}",
        "collection": "Bruno Automation Demo"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status should be 200", function () {
          expect(res.status).to.equal(200);
        });

        test("platform should match the active environment", function () {
          expect(res.body.platform).to.equal(bru.getGlobalEnvVar("platform_name"));
        });

        test("environment should match the active environment", function () {
          expect(res.body.environment).to.equal(bru.getGlobalEnvVar("target_environment"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: A clean first request for showing Bruno running the same check locally and in CI.
